name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          # The build scripts request Microsoft toolchains; Gradle picks these up instead of downloading them
          distribution: microsoft
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Check tag matches mod version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^mod\.version = "\(.*\)"$/\1/p' stonecutter.properties.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod.version $version in stonecutter.properties.toml"
            exit 1
          fi

      - name: Build mods
        run: ./gradlew buildAndCollect

      - name: Build Paper plugin
        run: ./gradlew -p paper build

      - name: Check Paper plugin against newest Paper API
        run: ./gradlew -p paper compileJava -Ppaper.api=$(sed -n 's/^paper\.api\.latest=//p' paper/gradle.properties) -Pjava.version=25

      - name: Collect jars
        run: |
          mkdir dist
          find build/libs paper/build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: jars
          path: dist/*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: dist

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The "## <version>" section of CHANGELOG.md, up to the next version heading
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No '## $version' section in CHANGELOG.md"
            exit 1
          fi
          cat notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.jar --title "Death Improvements Plus ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
