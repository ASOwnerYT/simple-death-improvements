org.gradle.jvmargs=-Xmx2G
org.gradle.configuration-cache=true


# Compiled against the oldest supported Paper version by default, so the jar runs on 1.21.1 and newer.
# Paper 26.x requires Java 25: -Ppaper.api=26.3.build.237-stable -Pjava.version=25
paper.api=1.21.1-R0.1-SNAPSHOT
java.version=21
# Newest Paper API, checked in CI so the plugin keeps compiling on current servers
paper.api.latest=26.3.build.237-stable
